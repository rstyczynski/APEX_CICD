name: Propose reviewed fixture
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr create --repo "$GITHUB_REPOSITORY" --base main --head candidate-reviewed --title 'Bot-proposed reviewed Oracle candidate' --body 'Requires trusted byte-bound Review, real Oracle Testing and independent code-owner approval. No candidate receives the owner OAuth credential.'
