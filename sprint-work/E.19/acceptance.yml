      - name: Action tool_version
        id: tool_version
        uses: ./actions/tool
        continue-on-error: true
        with:
          log: fixtures/tool
          config: fixtures/config
      - name: Mutation forbidden tool_version
        if: steps.tool_version.outcome == 'success'
        run: touch forbidden-tool_version
      - name: Assert refused tool_version
        env:
          OUTCOME: ${{ steps.tool_version.outcome }}
        run: |
          test "$OUTCOME" = failure
          test ! -e forbidden-tool_version
      - name: Prepare tool_metadata
        run: node fixtures.cjs tool metadata
      - name: Action tool_metadata
        id: tool_metadata
