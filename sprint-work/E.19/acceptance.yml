name: Catalogued acceptance matrix
on: workflow_dispatch
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test actions/checks.test.cjs
      - name: Prepare tool_valid
        run: node fixtures.cjs tool valid
      - name: Action tool_valid
        id: tool_valid
        uses: ./actions/tool
        with:
          log: fixtures/tool
          config: fixtures/config
      - name: Prepare tool_missing
        run: node fixtures.cjs tool missing
      - name: Action tool_missing
        id: tool_missing
        uses: ./actions/tool
        continue-on-error: true
        with:
          log: fixtures/tool
          config: fixtures/config
      - name: Mutation forbidden tool_missing
        if: steps.tool_missing.outcome == 'success'
        run: touch forbidden-tool_missing
      - name: Assert refused tool_missing
        env:
          OUTCOME: ${{ steps.tool_missing.outcome }}
        run: |
          test "$OUTCOME" = failure
          test ! -e forbidden-tool_missing
      - name: Prepare tool_malformed
        run: node fixtures.cjs tool malformed
      - name: Action tool_malformed
        id: tool_malformed
        uses: ./actions/tool
        continue-on-error: true
        with:
          log: fixtures/tool
          config: fixtures/config
      - name: Mutation forbidden tool_malformed
        if: steps.tool_malformed.outcome == 'success'
        run: touch forbidden-tool_malformed
      - name: Assert refused tool_malformed
        env:
          OUTCOME: ${{ steps.tool_malformed.outcome }}
        run: |
          test "$OUTCOME" = failure
          test ! -e forbidden-tool_malformed
      - name: Prepare tool_version
