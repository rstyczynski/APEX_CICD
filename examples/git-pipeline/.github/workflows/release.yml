name: Deploy selected version
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Published version tag, for example v1.0.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: e3-lab-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, e3-lab]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve selected version
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        run: |
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$VERSION_TAG:refs/tags/$VERSION_TAG"
          git checkout -B e3-release-build "$VERSION_TAG^{commit}"
      - name: Verify, package, deploy and check preservation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ inputs.version_tag }}
        run: bash scripts/release.sh "$VERSION_TAG"
      - name: Retain archive and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-release-${{ github.run_id }}
          path: |
            artifact/*.zip
            result/receipt.json
          if-no-files-found: warn
